name: Render Video
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'The ID of the video in the shorts_queue table'
        required: true
        type: string

jobs:
  render:
    name: Render and Upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Render and Upload
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          VIDEO_ID: ${{ github.event.inputs.video_id }}
        run: node scripts/render-and-upload.mjs
