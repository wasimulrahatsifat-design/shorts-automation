name: Auto-Publish
on:
  schedule:
    - cron: '*/15 * * * *' # Run every 15 minutes to check for due scheduled posts
  workflow_dispatch: # Allow manual trigger and webhook dispatch with target parameters
    inputs:
      video_id:
        description: 'Specific video ID to publish (optional)'
        required: false
        default: ''
      target:
        description: 'Target platform: youtube, meta, or all'
        required: false
        default: ''
      force:
        description: 'Force publish immediately ignoring future scheduled_time'
        required: false
        default: 'false'

jobs:
  publish:
    name: Check and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Auto-Publish Script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TARGET_VIDEO_ID: ${{ inputs.video_id || github.event.inputs.video_id || '' }}
          TARGET_PLATFORM: ${{ inputs.target || github.event.inputs.target || '' }}
          FORCE_PUBLISH: ${{ inputs.force || github.event.inputs.force || 'false' }}
        run: node scripts/auto-publish.mjs

